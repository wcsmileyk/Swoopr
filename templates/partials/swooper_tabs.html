{% with url=request.resolver_match.url_name %}
<div class="flex gap-1 border-b border-gray-800 mb-6">
  <a href="{% url 'swooper_dashboard' %}"
     class="px-4 py-2.5 text-sm font-medium border-b-2 transition-colors -mb-px
       {% if url == 'swooper_dashboard' %}border-sky-400 text-white{% else %}border-transparent text-gray-500 hover:text-gray-300{% endif %}">
    Dashboard
  </a>
  <a href="{% url 'flights' %}"
     class="px-4 py-2.5 text-sm font-medium border-b-2 transition-colors -mb-px
       {% if url == 'flights' or url == 'flight_detail' or url == 'upload_flight' or url == 'upload_results' or url == 'select_swoop_window' %}border-sky-400 text-white{% else %}border-transparent text-gray-500 hover:text-gray-300{% endif %}">
    GPS Flights
  </a>
  <a href="{% url 'public_swoops' %}"
     class="px-4 py-2.5 text-sm font-medium border-b-2 transition-colors -mb-px
       {% if url == 'public_swoops' or url == 'user_search' or url == 'public_profile' %}border-sky-400 text-white{% else %}border-transparent text-gray-500 hover:text-gray-300{% endif %}">
    Community
  </a>
</div>
{% endwith %}
